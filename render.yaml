# Render blueprint: Dashboard → New → Blueprint → this repo. Secrets (sync: false) are prompted once.
services:
  - type: web
    name: flam-structured-ai
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.12"
      - key: CLIENT_IP_HEADER # set by Cloudflare in front of Render; X-Forwarded-For there is client-written
        value: True-Client-IP
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_FALLBACK
        value: gemini
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false # e.g. https://<app>.vercel.app,http://localhost:5173
      - key: ALLOW_FAULTS
        value: "true"
